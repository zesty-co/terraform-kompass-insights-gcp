name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform ${{ matrix.terraform-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        terraform-version:
          - "1.14.5"
          - "1.9.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform-version }}

      - name: Check Terraform formatting
        run: make fmt-check

      - name: Validate modules and run offline tests
        run: make validate test

      - name: Install terraform-docs
        if: matrix.terraform-version == '1.14.5'
        env:
          VERSION: "0.20.0"
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-docs-bin"
          curl -fsSL -o "$RUNNER_TEMP/terraform-docs.tar.gz" \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${VERSION}/terraform-docs-v${VERSION}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/terraform-docs.tar.gz" -C "$RUNNER_TEMP/terraform-docs-bin" terraform-docs
          echo "$RUNNER_TEMP/terraform-docs-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/terraform-docs-bin/terraform-docs" --version

      - name: Check generated documentation
        if: matrix.terraform-version == '1.14.5'
        run: make docs-check
